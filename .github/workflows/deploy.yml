name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Set up QEMU for arm64 builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the backend image
        run: |
          docker buildx build --platform linux/arm64 \
            -f Dockerfile.lambda \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest \
            --push .

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --image-uri ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'

      - run: uv sync --extra dev

      # --skip-backup: safe_migrate.py's pg_dump backup would land on the
      # runner's ephemeral filesystem and be discarded the moment this job ends,
      # so it costs time and IO while retaining nothing to restore from. CI
      # relies on Neon's own branching / point-in-time recovery for migration
      # rollback safety instead.
      - name: Run database migration against Neon
        # Migrations need the DIRECT (unpooled) Neon connection: pg_dump and the
        # session-scoped pg_advisory_lock/unlock in safe_migrate.py are unsafe
        # through PgBouncer transaction pooling, which can hand the lock acquire
        # and release to different backend connections. NEON_DATABASE_URL (the
        # pooled string) is what the Lambda itself uses, set via Terraform's
        # var.database_url in infra/lambda.tf — this is a separate secret.
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: uv run python scripts/safe_migrate.py --skip-backup

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # No VITE_API_BASE_URL: the API is same-origin via CloudFront's "/api/*"
      # routing, so the build's default empty base URL yields relative calls.
      - name: Build frontend
        run: pnpm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync build output to S3
        run: aws s3 sync dist/ s3://${{ secrets.FRONTEND_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
